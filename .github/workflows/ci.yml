name: SunStay CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start stack
        run: docker compose up -d --build db api
      - name: Wait for API
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/api/health; then break; fi
            sleep 2
          done
      - name: Copy tests
        run: |
          docker cp backend/tests sunstay_api:/app/
          docker cp database/tests/week5_tests.sql sunstay_db:/tmp/week5_tests.sql
      - name: SQL tests
        run: docker compose exec -T db psql -U postgres -d hotel -f /tmp/week5_tests.sql
      - name: API tests
        run: docker compose exec -e PYTHONPATH=/app -T -w /app api pytest -q tests

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Build
        working-directory: frontend
        run: npm run build
      - name: Start stack
        run: docker compose up -d --build
      - name: Wait for web
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080; then break; fi
            sleep 2
          done
      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: E2E smoke
        working-directory: frontend
        env:
          BASE_URL: http://localhost:8080
        run: node scripts/smoke.mjs
