name: Keep Render awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnose API
        run: |
          echo "### API diagnostics" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          curl -sS -i --max-time 90 \
            -H "Origin: https://krokozyblyk.github.io" \
            https://sunstay-api.onrender.com/api/health >> $GITHUB_STEP_SUMMARY 2>&1 || true
          echo '```' >> $GITHUB_STEP_SUMMARY
      - name: Ping analytics
        run: |
          echo "### Analytics" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          curl -sS -i --max-time 90 \
            -H "Origin: https://krokozyblyk.github.io" \
            https://sunstay-analytics.onrender.com/api/openapi.json >> $GITHUB_STEP_SUMMARY 2>&1 || true
          echo '```' >> $GITHUB_STEP_SUMMARY
