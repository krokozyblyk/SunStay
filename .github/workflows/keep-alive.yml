name: Keep Render awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API
        run: curl -sS --max-time 60 https://sunstay-api.onrender.com/api/health || true
      - name: Ping analytics
        run: curl -sS --max-time 60 https://sunstay-analytics.onrender.com/api/openapi.json || true
