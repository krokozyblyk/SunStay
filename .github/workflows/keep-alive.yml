name: Keep Render awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnose API
        run: |
          echo "=== API ==="
          curl -sS -i --max-time 90 -H "Origin: https://krokozyblyk.github.io" https://sunstay-api.onrender.com/api/health || true
          echo "=== ANALYTICS ==="
          curl -sS -i --max-time 90 -H "Origin: https://krokozyblyk.github.io" https://sunstay-analytics.onrender.com/api/openapi.json || true
          exit 1
