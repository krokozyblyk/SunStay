name: Keep Render awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnose preflight
        run: |
          echo "=== OPTIONS /auth/login ==="
          curl -sS -i --max-time 90 -X OPTIONS \
            -H "Origin: https://krokozyblyk.github.io" \
            -H "Access-Control-Request-Method: POST" \
            -H "Access-Control-Request-Headers: content-type,authorization,idempotency-key" \
            https://sunstay-api.onrender.com/api/auth/login || true
          exit 1
