name: Diagnose SunStay API

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check health
        run: curl -sS --max-time 90 -w "\nHTTP %{http_code}\n" https://sunstay-api.onrender.com/api/health || true
      - name: Check room detail endpoint (new backend)
        run: curl -sS --max-time 90 -w "\nHTTP %{http_code}\n" https://sunstay-api.onrender.com/api/public/rooms/9 || true
      - name: Check 2FA status requires auth (new backend)
        run: curl -sS --max-time 90 -w "\nHTTP %{http_code}\n" https://sunstay-api.onrender.com/api/auth/2fa/status || true
      - name: Check public config
        run: curl -sS --max-time 90 -w "\nHTTP %{http_code}\n" https://sunstay-api.onrender.com/api/public/config || true
      - name: List public and auth routes
        run: |
          curl -sS --max-time 90 https://sunstay-api.onrender.com/api/openapi.json -o /tmp/openapi.json || true
          python3 -c "import json;d=json.load(open('/tmp/openapi.json'));print('\n'.join(sorted(p for p in d.get('paths',{}) if 'public' in p or '2fa' in p or 'config' in p or 'bulk' in p)))" || true
      - name: Check rating and amenities
        run: |
          curl -sS --max-time 90 'https://sunstay-api.onrender.com/api/public/rating' || true
          echo ""
          curl -sS --max-time 90 'https://sunstay-api.onrender.com/api/public/availability?checkin=2026-12-20&checkout=2026-12-22&guests=2' | python3 -c "import sys,json;d=json.load(sys.stdin);imgs=[r.get('image_url') for t in d for r in t.get('rooms',[])];print('TYPE_AMENITIES',d[0].get('amenities'));print('UNIQUE_IMAGES',len(set(imgs)),'of',len(imgs));print('SAMPLE',imgs[:3])" || true
